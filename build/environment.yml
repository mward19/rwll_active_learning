name: rwll_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # core scientific stack
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - pillow

  # requested direct deps / useful explicit pins
  - cycler
  - filelock
  - fonttools
  - fsspec
  - jinja2
  - joblib
  - kiwisolver
  - markupsafe
  - mpmath
  - networkx
  - packaging
  - pyparsing
  - python-dateutil
  - pytz
  - pyyaml
  - six
  - sympy
  - threadpoolctl
  - tqdm
  - typing_extensions
  - tzdata
